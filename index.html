
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>To-Do List</h1>

        <div class="inputbox">
            <input type="text" placeholder="What do you need to do?">
            <button>Add</button>
        </div>
        
        <ul class="tasklist">
            <h3 class="title">Click on the task to mark it completed!</h3>
            
        </ul>
    </div>


    <script src="script.js"></script>
</body>
</html>
